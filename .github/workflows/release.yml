name: Release agent binaries
 
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the release under"
        required: true
 
permissions:
  contents: write
 
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-go/go.mod
          cache-dependency-path: agent-go/go.sum
 
      - name: Cross-compile agent binaries
        working-directory: agent-go
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          # Optional build-time defaults; leave unset to rely on the installer .env prompt.
          SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
          ORG_ID: ${{ vars.AGENT_ORG_ID }}
          API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          chmod +x build.sh
          ./build.sh
 
      - name: Generate checksums
        working-directory: agent-go/dist
        run: sha256sum * > SHA256SUMS.txt
 
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            agent-go/dist/dpdp-agent-windows-amd64.exe
            agent-go/dist/dpdp-agent-darwin-amd64
            agent-go/dist/dpdp-agent-darwin-arm64
            agent-go/dist/install.ps1
            agent-go/dist/install.command
            agent-go/dist/SHA256SUMS.txt